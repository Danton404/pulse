<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pulse</title>
  <meta name="description" content="Pulse: live heart rate, workouts, health trends and an AI coach for the Fitbit Air.">
  <meta name="theme-color" content="#f6f3f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#110f0f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pulse">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <nav id="nav" class="nav" aria-label="Main"></nav>
    <div class="main">
      <header class="topbar">
        <h1 id="view-title">Today</h1>
        <div class="topbar-actions">
          <span id="conn" class="status" role="status" hidden></span>
          <button id="settings-btn" class="icon-btn" type="button" aria-label="Settings"></button>
        </div>
      </header>
      <main id="view"></main>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <dialog id="sheet" class="sheet"></dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
